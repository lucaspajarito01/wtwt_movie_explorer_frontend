<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · WTWT</title>
    <link rel="stylesheet" href="./src/css/login-style.css">
</head>
<body>
    <header class="site-header">
        <a href="#" class="brand">WTWT</a>
    </header>

    <main class="login-main">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-heading">
                <h1 id="login-title" class="login-title">Inicia sesión</h1>
                 <p class="login-subtitle">Guarda tus títulos, califica películas y crea listas.</p>
            </div>

            <form class="login-form" action="./src/html/peliculas.html" method="get">
                <div class="field">
                    <label class="label" for="email">Correo electrónico</label>
                    <input class="input" type="email" id="email" name="email" placeholder="@email.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <div class="field-row">
                        <label class="label" for="password">Contraseña</label>
                        <a href="#" class="link-small">¿Olvidaste tu contraseña?</a>
                    </div>
                    <input class="input" type="password" id="password" name="password" placeholder="***********" autocomplete="current-password" required>
                </div>

                <label class="checkbox">
                    <input type="checkbox" name="remember">
                    Mantener sesión iniciada
                </label>

                <button type="submit" class="btn btn-primary">Entrar</button>

                <div class="divider">o</div>


                <p class="login-footer">
                    ¿No tienes cuenta? <a href="#" class="link-strong">Regístrate</a>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
