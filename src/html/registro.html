<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta · WTWT</title>
    <link rel="stylesheet" href="../css/login-style.css">
</head>
<body>
    <header class="site-header">
        <a href="../../Index.html" class="brand">WTWT</a>
    </header>

    <main class="login-main">
        <section class="login-card" aria-labelledby="register-title">
            <div class="login-heading">
                <h1 id="register-title" class="login-title">Crea tu cuenta</h1>
                <p class="login-subtitle">Propón títulos, califica y comenta.</p>
            </div>

            <form id="register-form" class="login-form" action="../../Index.html" method="post" novalidate>
                <p class="form-alert" role="alert" hidden></p>

                <div class="field">
                    <label class="label" for="username">Nombre</label>
                    <input class="input" type="text" id="username" name="username" minlength="2" maxlength="100" autocomplete="nickname" required>
                </div>

                <div class="field">
                    <label class="label" for="email">Correo electrónico</label>
                    <input class="input" type="email" id="email" name="email" placeholder="@email.com" maxlength="100" autocomplete="email" required>
                </div>

                <div class="field">
                    <label class="label" for="password">Contraseña</label>
                    <input class="input" type="password" id="password" name="password" minlength="8" maxlength="72" autocomplete="new-password" aria-describedby="password-hint" required>
                    <p id="password-hint" class="field-hint">De 8 a 72 caracteres, con al menos una letra y un número.</p>
                </div>

                <div class="field">
                    <label class="label" for="confirm">Repite la contraseña</label>
                    <input class="input" type="password" id="confirm" name="confirm" autocomplete="new-password" required>
                </div>

                <label class="checkbox">
                    <input type="checkbox" name="remember">
                    Mantener sesión iniciada
                </label>

                <button type="submit" class="btn btn-primary" data-label="Crear cuenta">Crear cuenta</button>

                <p class="login-footer">
                    ¿Ya tienes cuenta? <a href="../../Index.html" class="link-strong">Inicia sesión</a>
                </p>
            </form>
        </section>
    </main>
    <script type="module" src="../Js/register.js"></script>
</body>
</html>
